
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>My First 360 Virtual Tour</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">

  <script
    src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js">
  </script>

  <style>
    body { margin: 0; }
    #panorama { width: 100%; height: 100vh; }
  </style>
</head>
<body>

  <div id="panorama"></div>

  <script>
    
const params = new URLSearchParams(window.location.search);
const selected = params.get('config');

// Only allow our two approved JSON files.
const configFile =
  selected === '2' ? 'config2.json' : 'config.json';

fetch(configFile)
  .then(response => {
    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }
    return response.json();
  })
  .then(config => {
    pannellum.viewer('panorama', config);
  })
  .catch(error => {
    document.getElementById('panorama').textContent =
      'Configuration loading failed: ' + error.message;
  });
  </script>

</body>
</html>
