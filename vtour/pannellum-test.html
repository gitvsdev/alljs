
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>My First 360 Virtual Tour</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css">

  <script
    src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js">
  </script>

  <style>
    body { margin: 0; }
    #panorama { width: 100%; height: 100vh; }
  </style>
</head>
<body>

  <div id="panorama"></div>

  <script>
    pannellum.viewer('panorama', {
      type: 'equirectangular',
      panorama: 'panorama.jpg',
      autoLoad: true,
      showFullscreenCtrl: true
    });
  </script>

</body>
</html>
